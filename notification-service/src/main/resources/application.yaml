spring:
  application:
    name: notification-service
  kafka:
    bootstrap-servers: localhost:9092

  # PostgresSQL Database Connection Settings
  datasource:
    url: jdbc:postgresql://localhost:5432/orderDB
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate Configurations
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081
